name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
        while IFS= read -r line; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q "^\s*#"; then
                continue
            fi
        
            echo "docker pull $line"
            docker pull $line
            platform=$(echo "$line" | awk -F"--platform[ =]" "{if (NF>1) print \$2}" | awk "{print \$1}")
            echo "platform is $platform"
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk "{print \$NF}")
            
            # 移除 Registry 前缀（如 docker.io/）和 @sha256 后缀
            # docker.io/nousresearch/hermes-agent:v2026.7.30 → nousresearch/hermes-agent:v2026.7.30
            image_full="${image#*/}"  # 去掉第一个/之前的部分
            image_full="${image_full%%@*}"  # 去掉 @sha256 后缀
            
            # 处理架构前缀
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            
            # 将镜像路径中的 / 替换为 -，避免多级路径问题
            # nousresearch/hermes-agent:v2026.7.30 → nousresearch-hermes-agent:v2026.7.30
            target_image=$(echo "$image_full" | sed "s/[\/]/-/g")
            
            # 构建最终镜像名
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$target_image"
            echo "docker tag $image $new_image"
            docker tag $image $new_image
            echo "docker push $new_image"
            docker push $new_image
        done < images.txt
